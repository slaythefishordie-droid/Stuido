<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Knowledge Studio</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
  <script src="popup-settings.js" defer></script>
</head>
<body>
  <h1>Knowledge Studio 设置</h1>
  <label><input id="youtubeEnabled" type="checkbox" checked>启用 YouTube 一键标记</label>
  <label>默认回溯 <select id="preRoll"><option value="0">0 秒</option><option value="1">1 秒</option><option value="2" selected>2 秒</option><option value="3">3 秒</option></select></label>
  <label>字号 <select id="fontSize"><option>12</option><option selected>14</option><option>16</option><option>18</option></select></label>
  <label>控件位置 <select id="buttonSide"><option value="right">右侧</option><option value="left">左侧</option></select></label>
  <label><input id="collapsed" type="checkbox" checked>默认收起精听面板</label>
  <button id="saveSettings">保存偏好</button>
  <h2>网站适配器</h2>
  <p>YouTube：普通视频标记 与精听。其他 HTTPS 网站：选文与页面音频定位；需逐站授权。</p>
  <button id="enableSite">为当前网站启用文章／播客采集</button>
  <div id="sites"></div><p id="settingsStatus" role="status"></p>
  <details><summary>共享诊断</summary>
  <p>在此写入记录，返回 Knowledge Studio 核对编号。再从主 App 写入，回到此处读取。</p>
  <button id="write">写入 Safari 验证记录</button>
  <button id="read">读取共享记录</button>
  <p>主 App 的记录</p><output id="app">尚未读取</output>
  <p>Safari 的记录</p><output id="safari">尚未读取</output>
  <p id="status" role="status" aria-live="polite"></p>
  </details>
</body>
</html>
