name: KnowledgeStudio
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: '17.0'
packages:
  KnowledgeStudio:
    path: ..
  YouTubePlayerKit:
    url: https://github.com/SvenTiigi/YouTubePlayerKit.git
    exactVersion: 2.0.5
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '0.1.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  KnowledgeStudio:
    type: application
    platform: iOS
    sources:
      - path: KnowledgeStudio
      - path: ../THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: KnowledgeStudio
        product: KnowledgeCore
      - package: YouTubePlayerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.knowledge-studio.prototype
        INFOPLIST_KEY_CFBundleDisplayName: Knowledge Studio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  KnowledgeStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../Tests/KnowledgeCoreTests
      - Tests
    dependencies:
      - target: KnowledgeStudio
      - package: KnowledgeStudio
        product: KnowledgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.knowledge-studio.prototype.tests
schemes:
  KnowledgeStudio:
    build:
      targets:
        KnowledgeStudio: all
        KnowledgeStudioTests: [test]
    test:
      targets: [KnowledgeStudioTests]
      gatherCoverageData: true
    archive:
      config: Release
