name: KnowledgeStudio
options:
  developmentLanguage: zh-Hans
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: '17.0'
packages:
  KnowledgeStudio:
    path: ..
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.11.1
  ReadiumZIPFoundation:
    url: https://github.com/readium/ZIPFoundation.git
    exactVersion: 3.0.1
  YouTubePlayerKit:
    url: https://github.com/SvenTiigi/YouTubePlayerKit.git
    exactVersion: 2.0.5
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: '5'
    MARKETING_VERSION: '1.0.1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  KnowledgeStudio:
    type: application
    platform: iOS
    sources:
      - path: KnowledgeStudio
      - path: Shared
      - path: ../THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: KnowledgeStudio
        product: KnowledgeCore
      - package: YouTubePlayerKit
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: ReadiumZIPFoundation
        product: ReadiumZIPFoundation
      - target: SafariExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.knowledge-studio.prototype
        CODE_SIGN_ENTITLEMENTS: KnowledgeStudio/KnowledgeStudio.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: KnowledgeStudio/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Knowledge Studio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  SafariExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariExtension
        excludes: [Resources]
      - path: Shared
      - path: SafariExtension/Resources
        type: group
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.knowledge-studio.prototype.SafariExtension
        INFOPLIST_FILE: SafariExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SafariExtension/SafariExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: KnowledgeStudio
        product: KnowledgeCore
      - sdk: SafariServices.framework
  KnowledgeStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../Tests/KnowledgeCoreTests
      - Tests
      - path: ../examples/import
        type: folder
        buildPhase: resources
    dependencies:
      - target: KnowledgeStudio
      - package: KnowledgeStudio
        product: KnowledgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.knowledge-studio.prototype.tests
schemes:
  KnowledgeStudio:
    build:
      targets:
        KnowledgeStudio: all
        KnowledgeStudioTests: [test]
    test:
      targets: [KnowledgeStudioTests]
      gatherCoverageData: true
    archive:
      config: Release
