name: Extract iPad simulator failure evidence

on: workflow_dispatch

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.ref == 'refs/heads/release-assets/v3.7.0'
    runs-on: macos-15-intel
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Extract inbox failure screenshot and accessibility data
        shell: bash
        run: |
          set -euo pipefail
          gh run download 44911559142 -n KnowledgeStudio-build-evidence-40 -D "$RUNNER_TEMP/result"
          ks_result=$(find "$RUNNER_TEMP/result" -type d -name SimulatorTests.xcresult -print -quit)
          test -n "$ks_result"
          mkdir -p evidence
          xcrun xcresulttool export attachments --path "$ks_result" --only-failures --output-path evidence
          xcrun xcresulttool get test-results tests --path "$ks_result" > evidence/tests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Inbox-simulator-failure-evidence
          path: evidence/
          retention-days: 7
