name: Import protocol
on:
  push:
    branches: [main]
    paths: ['schemas/**', 'examples/**', 'tools/**', 'ios/SafariExtension/Resources/**', 'package.json', 'package-lock.json', '.github/workflows/protocol.yml']
  pull_request:
    branches: [main]
    paths: ['schemas/**', 'examples/**', 'tools/**', 'ios/SafariExtension/Resources/**', 'package.json', 'package-lock.json', '.github/workflows/protocol.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: protocol-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate schema, duplicate preview and Safari message recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/protocol-tests.log
          npm run validate -- examples/import/valid-four-types.json > artifacts/protocol-preview.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: protocol-evidence-${{ github.run_number }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
